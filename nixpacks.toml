[phases.setup]
aptPkgs = ["libatomic1"]
nixPkgs = ["php82", "php82Extensions.intl", "php82Extensions.gd", "php82Extensions.zip"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build"
]

[start]
command = "php artisan storage:link --force ; php artisan optimize:clear ; php artisan migrate --force ; php artisan db:seed --force ; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
